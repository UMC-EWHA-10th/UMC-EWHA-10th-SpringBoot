spring:
  application:
    name: "umc"

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:umc
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true